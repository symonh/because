<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>ArgumentBase</title>
<style>
	:root { --bar: #2b3a4a; --accent: #22AAE0; }
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; font-family: "Helvetica Neue", Arial, sans-serif; color: #333; }
	#app { display: flex; flex-direction: column; height: 100vh; }
	#toolbar {
		display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
		padding: 6px 10px; background: var(--bar); color: #fff; user-select: none;
	}
	#toolbar .title { font-weight: 600; margin-right: 12px; letter-spacing: .3px; }
	#toolbar .maptitle { font-weight: 400; opacity: .85; margin-right: auto; max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	button.tb {
		background: #3a4b5c; color: #fff; border: 1px solid #4d5f70; border-radius: 5px;
		padding: 5px 9px; font-size: 13px; cursor: pointer;
	}
	button.tb:hover { background: #47596b; }
	button.tb:disabled { opacity: .4; cursor: default; }
	button.tb.green { background: #2e7d43; border-color: #3a935a; }
	button.tb.green:hover { background: #35924e; }
	button.tb.red { background: #a83a2e; border-color: #c04a3c; }
	button.tb.red:hover { background: #bd4234; }
	.sep { width: 1px; height: 22px; background: #4d5f70; margin: 0 4px; }
	#stage { position: relative; flex: 1; overflow: hidden; background:
		radial-gradient(circle, #f4f6f8 1px, transparent 1px) 0 0 / 22px 22px, #fafbfc; }
	#canvas { position: absolute; transform-origin: 0 0; }
	.argmap-svg { display: block; }
	#hint { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); color: #9aa7b3; font-size: 15px; text-align: center; }
	#editbox { position: absolute; display: none; z-index: 20; border: 2px solid var(--accent); border-radius: 6px;
		padding: 6px 10px; font-size: 14px; font-family: inherit; resize: none; box-shadow: 0 2px 10px rgba(0,0,0,.2); outline: none; }
	#status { position: absolute; right: 10px; bottom: 8px; font-size: 12px; color: #8a97a3; background: rgba(255,255,255,.8); padding: 2px 8px; border-radius: 4px; }
	input[type=file] { display: none; }
</style>
</head>
<body>
<div id="app">
	<div id="toolbar">
		<span class="title">ArgumentBase</span>
		<button class="tb" id="btnNew">New</button>
		<button class="tb" id="btnOpen">Open .mup</button>
		<button class="tb" id="btnSave">Save .mup</button>
		<button class="tb" id="btnPng">Export PNG</button>
		<span class="sep"></span>
		<button class="tb green" id="btnReason" title="Add a supporting reason to the selected claim">+ Reason</button>
		<button class="tb red" id="btnObjection" title="Add an opposing objection to the selected claim">+ Objection</button>
		<button class="tb" id="btnCo" title="Add a co-premise beside the selected premise">+ Co-premise</button>
		<button class="tb" id="btnImplicit" title="Toggle implicit / assumed premise">Implicit</button>
		<button class="tb" id="btnEdit" title="Edit text (or double-click a box)">Edit</button>
		<button class="tb red" id="btnDelete" title="Delete the selected box">Delete</button>
		<span class="sep"></span>
		<button class="tb" id="btnUndo">Undo</button>
		<button class="tb" id="btnRedo">Redo</button>
		<span class="sep"></span>
		<button class="tb" id="btnZoomIn">+</button>
		<button class="tb" id="btnZoomOut">−</button>
		<button class="tb" id="btnFit">Fit</button>
		<span class="maptitle" id="mapTitle"></span>
	</div>
	<div id="stage">
		<div id="canvas"></div>
		<div id="hint">Open a <b>.mup</b> file, or press <b>New</b> to start an argument map.<br><small>Drag a .mup onto this window to load it.</small></div>
		<textarea id="editbox" rows="2"></textarea>
		<div id="status"></div>
	</div>
</div>
<input type="file" id="fileInput" accept=".mup,application/json">

<!-- shared SVG filter for node shadows -->
<svg width="0" height="0" style="position:absolute"><defs>
	<filter id="nodeshadow" x="-20%" y="-20%" width="140%" height="140%">
		<feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.25"/>
	</filter>
</defs></svg>

<script src="app.js"></script>
<script>
(function () {
	'use strict';
	const A = window.ArgMap;
	const stage = document.getElementById('stage');
	const canvas = document.getElementById('canvas');
	const hint = document.getElementById('hint');
	const editbox = document.getElementById('editbox');
	const statusEl = document.getElementById('status');
	const mapTitleEl = document.getElementById('mapTitle');

	let doc = null;
	let selectedId = null;
	let undoStack = [], redoStack = [];
	let view = { x: 40, y: 20, scale: 1 };

	const controller = {
		get selectedId() { return selectedId; },
		select(id) { selectedId = id; rerender(); },
		editNode(id) { startEdit(id); }
	};

	// ---- rendering ----
	function rerender() {
		if (!doc) { canvas.innerHTML = ''; hint.style.display = ''; return; }
		hint.style.display = 'none';
		A.render(doc, canvas, controller);
		applyView();
		updateButtons();
	}
	function applyView() {
		canvas.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.scale})`;
	}
	function updateButtons() {
		const sel = selectedId != null ? A.findNode(doc, selectedId) : null;
		const isContent = sel && !A.isGroup(sel) && !A.isSticky(sel);
		document.getElementById('btnReason').disabled = !isContent;
		document.getElementById('btnObjection').disabled = !isContent;
		document.getElementById('btnCo').disabled = !sel;
		document.getElementById('btnImplicit').disabled = !sel;
		document.getElementById('btnEdit').disabled = !sel;
		document.getElementById('btnDelete').disabled = !sel || isRoot(selectedId);
		document.getElementById('btnUndo').disabled = !undoStack.length;
		document.getElementById('btnRedo').disabled = !redoStack.length;
		statusEl.textContent = doc ? (countNodes() + ' boxes · ' + Math.round(view.scale * 100) + '%') : '';
	}
	function countNodes() {
		let n = 0; (function s(x){ n++; for (const c of A.childrenOf(x)) s(c); })(doc); return n - 1;
	}

	// ---- undo ----
	function snapshot() { undoStack.push(JSON.stringify(doc)); if (undoStack.length > 100) undoStack.shift(); redoStack = []; }
	function undo() { if (!undoStack.length) return; redoStack.push(JSON.stringify(doc)); doc = JSON.parse(undoStack.pop()); rerender(); }
	function redo() { if (!redoStack.length) return; undoStack.push(JSON.stringify(doc)); doc = JSON.parse(redoStack.pop()); rerender(); }

	// ---- document loading ----
	function loadDoc(obj, name) {
		doc = obj;
		if (!doc.ideas) doc.ideas = {};
		selectedId = null; undoStack = []; redoStack = [];
		mapTitleEl.textContent = name || firstRootTitle() || '';
		rerender();
		fit();
	}
	function firstRootTitle() {
		const roots = A.childrenOf(doc).filter(n => !A.isGroup(n));
		return roots.length ? roots[0].title : '';
	}
	function newMap() {
		loadDoc({ formatVersion: 3, id: 'root', title: 'ArgumentBase map',
			ideas: { '1': { id: 1, title: 'Type your main claim here', attr: {} } } });
		snapshotBaseline();
	}
	function snapshotBaseline() { undoStack = []; redoStack = []; updateButtons(); }

	// ---- editing operations ----
	function newId() { return A.maxId(doc) + 1; }
	function groupChild(node, type) {
		for (const c of A.childrenOf(node)) if (A.isGroup(c) && A.attrOf(c).group === type) return c;
		return null;
	}
	function addReason(type) {
		const node = A.findNode(doc, selectedId);
		if (!node || A.isGroup(node) || A.isSticky(node)) return;
		snapshot();
		let g = groupChild(node, type);
		if (!g) {
			g = { id: newId(), title: 'group', attr: { group: type, contentLocked: true }, ideas: {} };
			node.ideas = node.ideas || {};
			node.ideas[String(A.nextRank(node))] = g;
		}
		const premise = { id: newId(), title: 'New ' + (type === A.OPPOSING ? 'objection' : 'reason'), attr: {} };
		g.ideas[String(A.nextRank(g))] = premise;
		selectedId = premise.id;
		rerender();
		startEdit(premise.id, true);
	}
	function addCoPremise() {
		const parentGroup = A.findParent(doc, selectedId);
		if (!parentGroup || !A.isGroup(parentGroup)) { flash('Select a premise inside a group first'); return; }
		snapshot();
		const premise = { id: newId(), title: 'New co-premise', attr: {} };
		parentGroup.ideas[String(A.nextRank(parentGroup))] = premise;
		selectedId = premise.id;
		rerender();
		startEdit(premise.id, true);
	}
	function toggleImplicit() {
		const node = A.findNode(doc, selectedId);
		if (!node) return;
		snapshot();
		const attr = A.attrOf(node);
		let sn = Array.isArray(attr.styleNames) ? attr.styleNames.slice() : [];
		const i = sn.indexOf(A.STYLE_IMPLICIT);
		if (i >= 0) sn.splice(i, 1); else sn.push(A.STYLE_IMPLICIT);
		if (sn.length) attr.styleNames = sn; else delete attr.styleNames;
		rerender();
	}
	function deleteNode() {
		if (isRoot(selectedId)) return;
		const parent = A.findParent(doc, selectedId);
		if (!parent) return;
		snapshot();
		removeChild(parent, selectedId);
		// if a group is now empty, remove it too
		if (A.isGroup(parent) && A.childrenOf(parent).length === 0) {
			const gp = A.findParent(doc, parent.id);
			if (gp) removeChild(gp, parent.id);
		}
		selectedId = null;
		rerender();
	}
	function removeChild(parent, id) {
		const ideas = parent.ideas || {};
		for (const k of Object.keys(ideas)) if (ideas[k].id === id) { delete ideas[k]; return; }
	}
	function isRoot(id) {
		return A.childrenOf(doc).some(n => n.id === id && !A.isGroup(n)) && !A.findParent(doc, id) === false
			? A.childrenOf(doc).some(n => n.id === id) : A.childrenOf(doc).some(n => n.id === id);
	}

	// ---- inline text editing ----
	let editingId = null;
	function startEdit(id, selectAll) {
		const node = A.findNode(doc, id);
		if (!node) return;
		const g = canvas.querySelector('.node[data-id="' + cssEsc(id) + '"], .sticky[data-id="' + cssEsc(id) + '"]');
		if (!g) return;
		const rect = g.getBoundingClientRect();
		const stageRect = stage.getBoundingClientRect();
		editingId = id;
		editbox.value = node.title || '';
		editbox.style.display = 'block';
		editbox.style.left = (rect.left - stageRect.left) + 'px';
		editbox.style.top = (rect.top - stageRect.top) + 'px';
		editbox.style.width = Math.max(rect.width, 120) + 'px';
		editbox.style.minHeight = rect.height + 'px';
		editbox.focus();
		if (selectAll) editbox.select();
	}
	function commitEdit() {
		if (editingId == null) return;
		const node = A.findNode(doc, editingId);
		if (node && node.title !== editbox.value) { snapshot(); node.title = editbox.value; }
		editingId = null;
		editbox.style.display = 'none';
		rerender();
	}
	editbox.addEventListener('blur', commitEdit);
	editbox.addEventListener('keydown', e => {
		// keep editing keystrokes inside the textarea — never let Enter/Tab/Delete
		// bubble to the canvas keyboard handler (which adds/deletes nodes)
		e.stopPropagation();
		if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitEdit(); }
		else if (e.key === 'Escape') { cancelEdit(); }
	});
	function cancelEdit() { editingId = null; editbox.style.display = 'none'; }
	function cssEsc(v) { return String(v).replace(/"/g, '\\"'); }

	// ---- pan / zoom ----
	function fit() {
		if (!doc) return;
		const svg = canvas.querySelector('svg');
		if (!svg) return;
		const w = svg.width.baseVal.value, h = svg.height.baseVal.value;
		const sw = stage.clientWidth - 40, sh = stage.clientHeight - 40;
		view.scale = Math.min(1, Math.min(sw / w, sh / h));
		view.x = (stage.clientWidth - w * view.scale) / 2;
		view.y = 20;
		applyView(); updateButtons();
	}
	function zoom(factor, cx, cy) {
		const ns = Math.max(0.15, Math.min(3, view.scale * factor));
		cx = cx == null ? stage.clientWidth / 2 : cx;
		cy = cy == null ? stage.clientHeight / 2 : cy;
		view.x = cx - (cx - view.x) * (ns / view.scale);
		view.y = cy - (cy - view.y) * (ns / view.scale);
		view.scale = ns;
		applyView(); updateButtons();
	}
	stage.addEventListener('wheel', e => { if (!doc) return; e.preventDefault();
		const r = stage.getBoundingClientRect();
		zoom(e.deltaY < 0 ? 1.1 : 0.9, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
	let panning = false, panStart = null;
	stage.addEventListener('mousedown', e => {
		if (e.target.closest('.node') || e.target.closest('.sticky')) return;
		panning = true; panStart = { x: e.clientX - view.x, y: e.clientY - view.y };
		selectedId = null; rerender();
	});
	window.addEventListener('mousemove', e => { if (!panning) return; view.x = e.clientX - panStart.x; view.y = e.clientY - panStart.y; applyView(); });
	window.addEventListener('mouseup', () => { panning = false; });

	// ---- files ----
	function openFile() { document.getElementById('fileInput').click(); }
	document.getElementById('fileInput').addEventListener('change', e => {
		const f = e.target.files[0]; if (!f) return; readFile(f); e.target.value = '';
	});
	function readFile(f) {
		const r = new FileReader();
		r.onload = () => { try { loadDoc(JSON.parse(r.result), f.name.replace(/\.mup$/i, '')); } catch (err) { flash('Could not parse ' + f.name + ': ' + err.message); } };
		r.readAsText(f);
	}
	function saveFile() {
		if (!doc) return;
		const blob = new Blob([JSON.stringify(doc)], { type: 'application/json' });
		const a = document.createElement('a');
		a.href = URL.createObjectURL(blob);
		a.download = (mapTitleEl.textContent || 'argument-map').replace(/[^\w -]+/g, '').trim() + '.mup';
		a.click(); URL.revokeObjectURL(a.href);
	}
	function exportPng() {
		const svg = canvas.querySelector('svg'); if (!svg) return;
		const clone = svg.cloneNode(true);
		// inline the shadow filter def so the standalone SVG renders it
		const defs = document.querySelector('#nodeshadow').closest('defs').cloneNode(true);
		clone.insertBefore(defs, clone.firstChild);
		const w = svg.width.baseVal.value, h = svg.height.baseVal.value;
		const xml = new XMLSerializer().serializeToString(clone);
		const img = new Image();
		img.onload = () => {
			const scale = 2, c = document.createElement('canvas'); c.width = w * scale; c.height = h * scale;
			const ctx = c.getContext('2d'); ctx.scale(scale, scale);
			ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0);
			c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b);
				a.download = (mapTitleEl.textContent || 'argument-map') + '.png'; a.click(); URL.revokeObjectURL(a.href); });
		};
		img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)));
	}

	// drag & drop
	window.addEventListener('dragover', e => { e.preventDefault(); });
	window.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f && /\.mup$/i.test(f.name)) readFile(f); });

	function flash(msg) { statusEl.textContent = msg; setTimeout(updateButtons, 2500); }

	// ---- wire toolbar ----
	document.getElementById('btnNew').onclick = newMap;
	document.getElementById('btnOpen').onclick = openFile;
	document.getElementById('btnSave').onclick = saveFile;
	document.getElementById('btnPng').onclick = exportPng;
	document.getElementById('btnReason').onclick = () => addReason(A.SUPPORTING);
	document.getElementById('btnObjection').onclick = () => addReason(A.OPPOSING);
	document.getElementById('btnCo').onclick = addCoPremise;
	document.getElementById('btnImplicit').onclick = toggleImplicit;
	document.getElementById('btnEdit').onclick = () => selectedId != null && startEdit(selectedId, true);
	document.getElementById('btnDelete').onclick = deleteNode;
	document.getElementById('btnUndo').onclick = undo;
	document.getElementById('btnRedo').onclick = redo;
	document.getElementById('btnZoomIn').onclick = () => zoom(1.2);
	document.getElementById('btnZoomOut').onclick = () => zoom(0.83);
	document.getElementById('btnFit').onclick = fit;

	// keyboard
	window.addEventListener('keydown', e => {
		if (editingId != null) return;
		if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
		if (!selectedId && e.key !== 'n') return;
		if (e.key === 'Enter') { e.preventDefault(); addReason(A.SUPPORTING); }
		else if (e.key === 'Tab') { e.preventDefault(); addCoPremise(); }
		else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteNode(); }
		else if (e.key === 'F2') { startEdit(selectedId, true); }
	});

	// ---- optional ?src= autoload (dev/testing) ----
	const params = new URLSearchParams(location.search);
	if (params.get('src')) {
		fetch(params.get('src')).then(r => r.text()).then(t => loadDoc(JSON.parse(t), params.get('src').replace(/.*\//, '').replace(/\.mup$/i, '')))
			.catch(err => flash('Load failed: ' + err.message));
	}
	window.addEventListener('resize', () => applyView());

	// Public hook — for automated testing now, and Drive/embedding integration later.
	window.ArgumentBase = {
		get doc() { return doc; },
		load: loadDoc,
		newMap: newMap,
		serialize: () => JSON.stringify(doc),
		select: id => controller.select(id),
		startEdit: startEdit,
		cancelEdit: cancelEdit,
		findNode: id => A.findNode(doc, id),
		addReason: addReason,
		addObjection: () => addReason(A.OPPOSING),
		addCoPremise: addCoPremise,
		toggleImplicit: toggleImplicit,
		deleteNode: deleteNode,
		undo: undo, redo: redo,
		state: () => ({ selectedId, nodes: countNodes(), undo: undoStack.length, redo: redoStack.length })
	};
})();
</script>
</body>
</html>
