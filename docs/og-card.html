<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Because — og:image source</title>
<!--
  Source for site/og.png, the 1200x630 social card. Not part of the
  deployed site (deploy.sh stages app/, samples/ and site/ only) — it lives
  here so the card can be regenerated when the landing hero changes, which
  is the one thing that puts the two out of step.

  Regenerate:
    node -e "…playwright… page.setViewportSize({width:1200,height:630});
             page.goto('file://…/docs/og-card.html');
             page.screenshot({path:'site/og.png'})"
  or any headless shot of this file at 1200x630, deviceScaleFactor 1.

  The map below mirrors the hero in site/index.html; keep the two in step.
-->
<style>
	:root {
		--bg: #17191c;
		--bg-canvas: #1b1d20;
		--border-strong: #3d4248;
		--text-strong: #f1f3f5;
		--muted: #9aa1a8;
		--accent: #5cc8f2;
		--green: #45c07d;
		--radius: 14px;
		--font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; padding: 0; }
	body {
		width: 1200px;
		height: 630px;
		background:
			radial-gradient(900px 420px at 88% 8%, rgba(34,170,224,0.10), transparent 60%),
			radial-gradient(700px 380px at 4% 96%, rgba(69,192,125,0.08), transparent 62%),
			var(--bg);
		color: var(--text-strong);
		font-family: var(--font);
		display: grid;
		grid-template-columns: 1fr 1fr;
		align-items: center;
		gap: 34px;
		padding: 56px 60px;
	}
	.brand { display: flex; align-items: center; gap: 16px; margin-bottom: 30px; }
	.brand-name { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
	h1 {
		margin: 0 0 26px;
		font-size: 58px;
		line-height: 1.08;
		letter-spacing: -0.03em;
		font-weight: 750;
	}
	h1 .hl { color: #22aae0; }
	.url { color: var(--accent); font-size: 26px; font-weight: 650; margin: 0 0 8px; }
	.sub { color: var(--muted); font-size: 21px; margin: 0; }

	/* ---- the hero map, mirroring site/index.html ---- */
	.canvas {
		position: relative;
		background: var(--bg-canvas);
		border: 1px solid var(--border-strong);
		border-radius: var(--radius);
		box-shadow: 0 30px 70px -30px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.02) inset;
		overflow: hidden;
	}
	.grid {
		position: absolute;
		inset: 0;
		background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1.4px);
		background-size: 18px 18px;
	}
	.canvas-bar {
		position: relative;
		display: flex;
		align-items: center;
		gap: 9px;
		padding: 11px 15px;
		background: #24272b;
		border-bottom: 1px solid #34383d;
		font-size: 15px;
		color: #c3c8cd;
	}
	.map { position: relative; padding: 32px 28px 36px; }
	.node {
		background: #fff;
		color: #1b1d20;
		border: 1px solid #c9ced4;
		border-radius: 9px;
		padding: 11px 15px;
		font-size: 17px;
		font-weight: 550;
		line-height: 1.3;
		text-align: center;
		text-wrap: balance;
		box-shadow: 0 2px 6px rgba(0,0,0,0.35);
	}
	.node.root {
		background: #22aae0;
		border-color: #1c93c4;
		color: #fff;
		font-weight: 650;
		box-shadow: 0 4px 14px -2px rgba(34,170,224,0.6);
	}
	.conclusion { max-width: 330px; margin: 0 auto; }
	.links { display: block; width: 100%; height: 46px; }
	.links .link { fill: none; stroke: var(--green); stroke-width: 2; stroke-linecap: round; }
	.group {
		border-radius: 12px;
		padding: 12px 12px 14px;
		border: 1.5px solid rgba(69,192,125,0.65);
		background: rgba(69,192,125,0.13);
	}
	.glabel {
		font-size: 12.5px;
		font-weight: 700;
		letter-spacing: 0.09em;
		text-transform: uppercase;
		color: var(--green);
		margin: 0 2px 10px;
	}
	.nodes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
	.nodes .node { display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div>
	<div class="brand">
		<svg aria-hidden="true" viewBox="0 0 24 24" width="52" height="52"><rect x="7" y="2" width="10" height="6" rx="1.5" fill="#fff" stroke="#707070"/><path d="M12 8v3" stroke="#339966" stroke-width="2"/><path d="M3 12h18M3 12q0 2.5 2.5 2.5M21 12q0 2.5-2.5 2.5" stroke="#339966" stroke-width="2" fill="none"/><rect x="2" y="16" width="8" height="6" rx="1.5" fill="#fff" stroke="#707070"/><rect x="14" y="16" width="8" height="6" rx="1.5" fill="#fff" stroke="#707070" stroke-dasharray="2.5,1.6"/></svg>
		<span class="brand-name">Because</span>
	</div>
	<h1>A free editor for<br><span class="hl">argument maps</span>,<br>in your browser.</h1>
	<p class="url">app.philmaps.com</p>
	<p class="sub">No sign-up, nothing to install.</p>
</div>

<div class="canvas">
	<div class="grid"></div>
	<div class="canvas-bar">
		<svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17"><rect x="7" y="2" width="10" height="6" rx="1.5" fill="#fff" stroke="#707070"/><path d="M12 8v3" stroke="#339966" stroke-width="2"/><path d="M3 12h18M3 12q0 2.5 2.5 2.5M21 12q0 2.5-2.5 2.5" stroke="#339966" stroke-width="2" fill="none"/><rect x="2" y="16" width="8" height="6" rx="1.5" fill="#fff" stroke="#707070"/><rect x="14" y="16" width="8" height="6" rx="1.5" fill="#fff" stroke="#707070" stroke-dasharray="2.5,1.6"/></svg>
		<span>eradicate-aging.mup</span>
	</div>
	<div class="map">
		<div class="node root conclusion">We have a moral duty to eradicate aging</div>
		<svg class="links" viewBox="0 0 100 46" preserveAspectRatio="none">
			<path class="link" d="M50 0 L50 46" vector-effect="non-scaling-stroke"/>
		</svg>
		<div class="group">
			<div class="glabel">Co-premises</div>
			<div class="nodes">
				<div class="node">Aging is a great evil</div>
				<div class="node">We have a moral duty to eradicate great evils</div>
			</div>
		</div>
	</div>
</div>
</body>
</html>
