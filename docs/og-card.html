<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Because — og:image source</title>
<!--
  Source for site/og.png, the 1200x630 social card. Not part of the deployed
  site (deploy.sh stages app/, samples/ and site/ only) — it lives here so the
  card can be regenerated when the hero changes.

  The map is the REAL figure: site/css/argmap.css draws it and
  figures/build.mjs renders it from figures/maps/home-aging.json, the same map
  the landing hero uses, so the card cannot drift from the page again. Never
  edit between the argmap markers below.

  Regenerate the PNG (needs `python3 -m http.server 8871` at the repo root,
  like the test suites):

    cd test && node og-shot.js
-->
<link rel="stylesheet" href="../site/css/argmap.css">
<style>
	:root {
		--bg: #17191c;
		--text-strong: #f1f3f5;
		--muted: #9aa1a8;
		--accent: #5cc8f2;
		--font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; padding: 0; }
	body {
		width: 1200px;
		height: 630px;
		background:
			radial-gradient(900px 420px at 88% 8%, rgba(34,170,224,0.10), transparent 60%),
			radial-gradient(700px 380px at 4% 96%, rgba(69,192,125,0.08), transparent 62%),
			var(--bg);
		color: var(--text-strong);
		font-family: var(--font);
		display: grid;
		grid-template-columns: 1fr 1fr;
		align-items: center;
		gap: 34px;
		padding: 56px 60px;
		overflow: hidden;
	}
	.brand { display: flex; align-items: center; gap: 16px; margin-bottom: 30px; }
	.brand-name { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
	h1 {
		margin: 0 0 26px;
		font-size: 58px;
		line-height: 1.08;
		letter-spacing: -0.03em;
		font-weight: 750;
	}
	h1 .hl { color: #22aae0; }
	.url { color: var(--accent); font-size: 26px; font-weight: 650; margin: 0 0 8px; }
	.sub { color: var(--muted); font-size: 21px; margin: 0; }

	/* The figure is a card here: it must never scroll (a screenshot has no
	   scrollbar to drag) and it is drawn a size up, since the whole image gets
	   shown small in a timeline. */
	.card { min-width: 0; }
	.fig .argmap { font-size: 1.0625rem; }
	.fig-scroller { overflow: hidden; padding-block: 2rem; }
	.fig-chrome { padding: 12px 16px; font-size: 15px; }
	.fig-chrome svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<div>
	<div class="brand">
		<svg aria-hidden="true" viewBox="0 0 24 24" width="52" height="52"><rect x="7" y="2" width="10" height="6" rx="1.5" fill="#fff" stroke="#707070"/><path d="M12 8v3" stroke="#339966" stroke-width="2"/><path d="M3 12h18M3 12q0 2.5 2.5 2.5M21 12q0 2.5-2.5 2.5" stroke="#339966" stroke-width="2" fill="none"/><rect x="2" y="16" width="8" height="6" rx="1.5" fill="#fff" stroke="#707070"/><rect x="14" y="16" width="8" height="6" rx="1.5" fill="#fff" stroke="#707070" stroke-dasharray="2.5,1.6"/></svg>
		<span class="brand-name">Because</span>
	</div>
	<h1>A free editor for<br><span class="hl">argument maps</span>,<br>in your browser.</h1>
	<p class="url">app.philmaps.com</p>
	<p class="sub">No sign-up, nothing to install.</p>
</div>

<div class="card">
	<!-- Generated by figures/build.mjs from figures/maps/home-aging.json. -->
	<!-- argmap:home-aging -->
	<figure class="fig" id="fig-home-aging"><div class="fig-chrome"><svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15"><rect x="7" y="2" width="10" height="6" rx="1.5" fill="#fff" stroke="#707070"/><path d="M12 8v3" stroke="#339966" stroke-width="2"/><path d="M3 12h18M3 12q0 2.5 2.5 2.5M21 12q0 2.5-2.5 2.5" stroke="#339966" stroke-width="2" fill="none"/><rect x="2" y="16" width="8" height="6" rx="1.5" fill="#fff" stroke="#707070"/><rect x="14" y="16" width="8" height="6" rx="1.5" fill="#fff" stroke="#707070" stroke-dasharray="2.5,1.6"/></svg><span class="fig-file">eradicate-aging.mup</span></div><div class="fig-canvas" data-argmap="home-aging"><div class="fig-scroller"><div class="argmap" role="tree" aria-roledescription="argument map" aria-describedby="fig-home-aging-desc" aria-activedescendant="" style="--claim-max-ch:26"><div class="am-node-wrap"><div class="am-claim" role="treeitem" tabindex="-1" aria-level="1" aria-selected="false" data-num="1.1"><span class="am-badge" aria-hidden="true">1.1</span><span class="am-text">We have a moral duty to eradicate aging.</span></div><div class="am-groups" role="group"><div class="am-group am-supporting" data-group-type="supporting" data-strength="normal"><div class="am-bracket" aria-hidden="true"><span class="am-stem" aria-hidden="true"></span></div><div class="am-claims"><div class="am-node-wrap"><div class="am-claim" role="treeitem" tabindex="-1" aria-level="2" aria-selected="false" data-num="2.1"><span class="am-badge" aria-hidden="true">2.1</span><span class="am-text">Aging is a great evil.</span></div></div><div class="am-node-wrap"><div class="am-claim" role="treeitem" tabindex="-1" aria-level="2" aria-selected="false" data-num="2.2"><span class="am-badge" aria-hidden="true">2.2</span><span class="am-text">We have a moral duty to eradicate great evils.</span></div></div></div></div></div></div><svg class="am-links" aria-hidden="true" focusable="false"></svg></div></div><p class="visually-hidden" id="fig-home-aging-desc">Conclusion (1.1): ‘We have a moral duty to eradicate aging.’ It is supported by one reason. A reason supports the conclusion, containing claims 2.1 ‘Aging is a great evil.’ and 2.2 ‘We have a moral duty to eradicate great evils.’</p></div></figure>
	<!-- /argmap:home-aging -->
</div>
<script type="module" src="../site/js/argmap.js"></script>
</body>
</html>
